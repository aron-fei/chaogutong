    tabs: [['overview', '概览'], ['list', '涨跌榜'], ['arb', '内外盘比价']],
    listRows: [['黄金', 'COMEX', '4464.9', '+0.48'], ['白银', 'COMEX', '52.31', '+1.03'], ['WTI原油', 'NYMEX', '88.42', '+1.17'], ['布伦特', 'ICE', '91.5', '+0.95'], ['伦铜', 'LME', '10140', '+0.68'], ['伦铝', 'LME', '2712', '-0.31']],
    arbRows: [['黄金', '沪金 588.6 vs 外盘 4464.9', '溢价 +1.2% 平水'], ['铜', '沪铜 74680 vs 外盘 10140', '进口利润 微正'], ['原油', 'SC 588.6 vs WTI 88.42', '到岸贴水']]
  }
};

let curMk = 'ash', curTab = 'overview';
const seg = $('#mkt-seg'), navList = $('#nav-list'), ptTitle = $('#pt-title'),
      ptSource = $('#pt-source'), ptShell = $('#pt-shell'), ptBody = $('#pt-body');

function cardsHtml(list) {
  return '<div class="idx-row">' + list.map(i => `
    <div class="idx"><div class="nm"><span>${i.n}</span><span class="mono">${i.c}</span></div>
    <div class="pr ${priceCls(i.p)}">${i.v}</div>
    <div class="nm"><span>${red(i.p)}</span><span class="sb">${i.s}</span></div></div>`).join('') + '</div>';
}
function tblHtml(cols, rows, pctIdx) {
  return `<div class="sec" style="padding:0"><div class="sec" style="padding:0"><table><thead><tr>
    ${cols.map(c => `<th class="${c.right ? 'c' : ''}">${c.t}</th>`).join('')}</tr></thead><tbody>` +
    rows.map(r => '<tr>' + r.map((v, i) => i === pctIdx ? `<td class="c ${v > 0 ? 'up' : v < 0 ? 'down' : 'flat'} pc">${v > 0 ? '+' : ''}${v}%</td>` : `<td class="${cols[i] && cols[i].right ? 'c mono' : ''}">${v}</td>`).join('') + '</tr>').join('') +
    '</tbody></table></div></div>';
}
function linkageHtml(m) {
  return '<div class="sec">' + m.linkage.map(b => `
    <div class="blk"><div class="blk-hd">${b.hd}<span class="r">${b.note}</span></div>
    <div class="chips">${b.chips.map(c => `<span class="chip">${c}</span>`).join('')}</div></div>`).join('') + '</div>';
}
function renderNav() {
  const m = MK[curMk];
  navList.innerHTML = m.nav.map(n => `
    <div class="nav-item ${n.cls || ''} ${n.k === curTab ? 'sel' : ''}"
         data-k="${n.k}">${n.t}</div>`).join('');
  navList.querySelectorAll('.nav-item[data-k]').forEach(el => {
    el.addEventListener('click', () => { curTab = el.dataset.k; paint(); });
  });
}
function renderTabs() {
  const m = MK[curMk];
  const strip = '<div class="tabs" id="mt-tabs">' + m.tabs.map(t =>
    `<button class="${t[0] === curTab ? 'active' : ''}" data-t="${t[0]}">${t[1]}</button>`).join('') + '</div>';
  return strip;
}
function paint() {
  const m = MK[curMk];
  if (!m.tabs.some(t => t[0] === curTab)) curTab = m.tabs[0][0];
  seg.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.mk === curMk));
  ptTitle.textContent = '📊 ' + m.name;
  ptSource.innerHTML = '数据源: ' + m.source + (m.lag ? ' &nbsp;<span class="tag lag">~15min 延迟（免费源）</span>' : ' &nbsp;<span class="tag">实测可用</span>');
  ptShell.innerHTML = `
    <span class="s">⏱ 本地 <b class="mono" id="lcl">${lcl()}</b></span>
    <span class="s">状态 <span class="pill ${m.state.cls}">● ${m.state.txt}</span></span>
    <span class="s">最后更新 <b>${m.extraTxt || '示意'}</b></span>
    <span class="s">市场外壳 MarketShell（统一）</span>`;
  let body = renderTabs();
  if (curTab === 'overview' || curTab === 'ov') body += cardsHtml(m.indices) + footNote(m);
  else if (curTab === 'link') body += linkageHtml(m);
  else if (curTab === 'sector') body += tblHtml([{t:'板块/品种'},{t:'涨跌%',right:true},{t:'代表标的'}], m.sectorRows, 1);
  else if (curTab === 'gain' || curTab === 'cpop' || curTab === 'hot' || curTab === 'list')
    body += tblHtml([{t:'名称'},{t:'代码',right:false},{t:'现价',right:true},{t:'涨跌%',right:true}],
      curTab === 'gain' ? m.gainRows : curTab === 'cpop' ? m.cpopRows : curTab === 'hot' ? m.hotRows : m.listRows, 3);
  else if (curTab === 'arb' || curTab === 'night')
    body += tblHtml([{t:'项目'},{t:'对比'},{t:'结论'}], curTab === 'arb' ? m.arbRows : m.nightRows, -1);
  else if (curTab === 'wl')
    body += tblHtml([{t:'名称'},{t:'代码'},{t:'现价',right:true},{t:'涨跌%',right:true}], m.watchRows || [], 3);
  ptBody.innerHTML = body;
  ptBody.querySelectorAll('#mt-tabs button').forEach(b =>
    b.addEventListener('click', () => { curTab = b.dataset.t; paint(); }));
}
function footNote(m) {
  const notes = {
    ash: '<div class="foot">现有 13 个业务 tab（时段建议/持仓/复盘/心法等）结构不变、零回归；本市场只新增「联动观察」入口。</div>',
    fut: '<div class="foot">板块按 黑色/有色/能化/农产品/贵金属/股指 分组；夜盘时段状态机独立判定。</div>'
  };
  return notes[m] || '<div class="foot">榜单族表格 · 沿用现有 sortable 表头与涨幅榜渲染组件。</div>';
}
function lcl() { const n = new Date();
  return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`; }

seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
  curMk = b.dataset.mk; curTab = 'overview'; paint(); renderNav();
  try { location.hash = 'mk=' + curMk; localStorage.setItem('wb-market', curMk); } catch (e) {}
}));
(function init() {
  let m = 'ash';
  try {
    if (location.hash.indexOf('mk=') >= 0) m = location.hash.split('mk=')[1].split('&')[0];
    else m = localStorage.getItem('wb-market') || 'ash';
  } catch (e) {}
  curMk = MK[m] ? m : 'ash'; curTab = 'overview';
  renderNav(); paint();
  setInterval(() => { const c = $('#clock'), l = $('#lcl');
    if (c) c.textContent = lcl(); if (l) l.textContent = lcl(); }, 1000);
})();
</script>
</body>
</html>
